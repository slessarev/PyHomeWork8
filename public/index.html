<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Змейка</title>
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<header class="topbar">
		<div class="brand">Змейка</div>
		<div class="scoreboard">
			<span>Счёт: <strong id="scoreValue">0</strong></span>
			<button id="restartBtn" class="restart">⟲</button>
		</div>
	</header>

	<main class="game-wrapper">
		<canvas id="gameCanvas"></canvas>
		<section class="highscores">
			<h2>Рекорды</h2>
			<ol id="scoresList"></ol>
		</section>
	</main>

	<nav id="controls" class="controls">
		<button class="ctrl ctrl-up" data-dir="up" aria-label="Вверх">▲</button>
		<button class="ctrl ctrl-left" data-dir="left" aria-label="Влево">◀</button>
		<button class="ctrl ctrl-right" data-dir="right" aria-label="Вправо">▶</button>
		<button class="ctrl ctrl-down" data-dir="down" aria-label="Вниз">▼</button>
	</nav>

	<script src="/game.js"></script>
</body>
</html>
